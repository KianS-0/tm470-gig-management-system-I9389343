<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GigTracker - Login</title>
  <link rel="stylesheet" href="/styles.css">
</head>

<body>
  <nav>
    <a href="/">Home</a>
    <a href="/gigs">Gigs</a>
    <a href="/artists">Artists</a>
    <a href="/venues">Venues</a>
    <a href="/add-gig.html">Add Gig</a>
    <a href="/login">Login</a>
    <a href="/register">Register</a>
  </nav>

  <main class="page">
    <div class="card">
      <h1>Log in</h1>

      <p>
        Log in to your GigTracker account.
      </p>

      <form action="/login" method="POST">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          required
          maxlength="255"
          autocomplete="email"
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          required
          autocomplete="current-password"
        >

        <button class="button" type="submit">
          Log in
        </button>
      </form>

      <p class="helper-text">
        Don't have an account?
        <a href="/register">Register here</a>
      </p>
    </div>
  </main>
</body>
</html>
