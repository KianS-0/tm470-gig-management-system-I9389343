<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GigTracker - Register</title>
  <link rel="stylesheet" href="/styles.css">
</head>

<body>
  <nav>
    <a href="/">Home</a>
    <a href="/gigs">Gigs</a>
    <a href="/artists">Artists</a>
    <a href="/venues">Venues</a>
    <a href="/add-gig.html">Add Gig</a>
    <a href="/login">Login</a>
    <a href="/register">Register</a>
  </nav>

  <main class="page">
    <div class="card">
      <h1>Create an account</h1>

      <p>
        Register for GigTracker to manage your gigs, artists and venues.
      </p>

      <form action="/register" method="POST">
        <label for="name">Name</label>
        <input
          type="text"
          id="name"
          name="name"
          required
          maxlength="100"
          autocomplete="name"
        >

        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          required
          maxlength="255"
          autocomplete="email"
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          required
          minlength="8"
          autocomplete="new-password"
        >

        <label for="confirm_password">Confirm password</label>
        <input
          type="password"
          id="confirm_password"
          name="confirm_password"
          required
          minlength="8"
          autocomplete="new-password"
        >

        <button class="button" type="submit">
          Create account
        </button>
      </form>

      <p class="helper-text">
        Already have an account?
        <a href="/login">Log in here</a>
      </p>
    </div>
  </main>
</body>
</html>
