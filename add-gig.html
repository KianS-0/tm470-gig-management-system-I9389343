<!DOCTYPE html>
<html>
<head>
  <title>GigTracker - Add Gig</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      line-height: 1.6;
      background-color: #f4f4f4;
      color: #222;
    }

    nav {
      background-color: #111827;
      padding: 20px 40px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-right: 20px;
      font-weight: bold;
    }

    .page {
      padding: 40px;
    }

    .card {
      background-color: white;
      padding: 30px;
      border-radius: 8px;
      max-width: 600px;
    }

    h1 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      margin-bottom: 10px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .button {
      display: inline-block;
      padding: 12px 20px;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
      background-color: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="/gigs">Gigs</a>
    <a href="artists">Artists</a>
    <a href="venues.html">Venues</a>
    <a href="add-gig.html">Add Gig</a>
    <a href="login.html">Login</a>
    <a href="register.html">Register</a>
  </nav>

  <div class="page">
    <div class="card">
      <h1>Add Gig</h1>
      <p>Add a new live event to your tracker.</p>

      <form action="/add-gig" method="POST">
  <label for="title">Gig Title</label>
  <input type="text" id="title" name="title" placeholder="Enter gig title" required>

  <label for="artist">Artist</label>
  <input type="text" id="artist" name="artist" placeholder="Enter artist name" required>

  <label for="venue">Venue</label>
  <input type="text" id="venue" name="venue" placeholder="Enter venue name" required>

  <label for="city">City</label>
  <input type="text" id="city" name="city" placeholder="Enter city" required>

  <label for="date">Date</label>
  <input type="date" id="date" name="gig_date" required>

  <label for="ticket-link">Ticket Link</label>
  <input type="url" id="ticket-link" name="ticket_url" placeholder="Enter ticket link">

  <label for="status">Attendance Status</label>
  <select id="status" name="attendance_status">
    <option>Going</option>
    <option>Maybe</option>
    <option>Went</option>
  </select>

  <label for="notes">Notes</label>
  <textarea id="notes" name="notes" placeholder="Add any extra notes about the event"></textarea>

  <button class="button" type="submit">Save Gig</button>
</form>
    </div>
  </div>
</body>
</html>
